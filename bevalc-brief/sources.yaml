# Bev-Alc Morning Brief: source lists
#
# This file controls which sources the daily brief may use. It changes whenever
# you give feedback ("block X", "allow Y", "make Z tier 2").
#
#   allow    Use freely. The tier sets ranking and the label on each item.
#   block    Never use. Matching items are dropped. Viewers can also add blocks
#            with the Block button in the brief's Sources section.
#   pending  Sources that appeared in a brief but have no decision yet. They are
#            used only if the item passes the content rules and are marked
#            "New source". One not blocked by the next brief moves to allow.
#   syndicators  Republishers (AOL, Yahoo, MSN...). Never credited as a source:
#            the brief resolves the item to the original publisher and applies
#            that publisher's list status.
#
# Tiers: T1 data and official bodies · T1b company releases and filings ·
#        T2 general and business press · T3 trade press with sourced reporting
#
# Matching is by domain, and a subdomain matches its parent (news.example.com
# matches example.com). Entry fields: domain, name, tier (allow and pending
# only), added (date), note (why it is on the list; feedback is quoted here).
#
# STANDING RULE: English-language sources only (user, 2026-11-04). Any article
# not published in English is excluded, whatever list its domain is on. A
# non-English outlet that turns up is added straight to `block` with no need to
# ask. Official bodies based outside English-speaking countries (Comité
# Champagne, BNIC, OIV) stay allowed, but only their English-language pages
# and releases are used.
#
# Content rules apply on top of these lists. Even an allowed source has its
# reviews, recipes, gift guides and sponsored posts dropped. Awards and rankings
# coverage IS included (user, 2026-11-04) in its own "Awards & rankings" section.

